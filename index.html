<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChronosMatch | Zero-Copy High-Frequency Trading Engine</title>
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #080a0f;
            --bg-surface: #0f131c;
            --bg-elevated: #161b26;
            --border: #232a3b;
            --border-highlight: #333d54;
            --green: #10b981;
            --green-glow: rgba(16, 185, 129, 0.18);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.18);
            --blue: #3b82f6;
            --blue-glow: rgba(59, 130, 246, 0.18);
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Space Grotesk', -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        .mono {
            font-family: 'JetBrains Mono', monospace;
        }

        header {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .logo-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-badge {
            background: linear-gradient(135deg, #2563eb, #10b981);
            color: #fff;
            font-weight: 700;
            font-size: 13px;
            padding: 5px 12px;
            border-radius: 6px;
            letter-spacing: 1px;
        }

        .logo-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

         .logo-tag {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header-stats {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 130, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--green);
            font-size: 12px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
        }

         .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 187, 130, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 188, 130, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 188, 129, 0); }
        }

         .github-link {
            color: var(--text-secondary);
            font-size: 12px;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 6px;
            transition: all 0.2s;
        }

        .github-link:hover {
            color: #fff;
            border-color: var(--blue);
        }

         /* Metrics Bar */
        .metrics-bar {
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            padding: 10px 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 16px;
        }

        .metric-card {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .metric-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .metric-val {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
        }

         .metric-highlight {
            color: var(--green);
        }

        /* Main Workspace */
        main {
            flex: 1;
            padding: 20px 24px;
            display: grid;
            grid-template-columns: 340px 1fr 340px;
            gap: 20px;
        }

        @media (max-width: 1200px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-elevated);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
 .panel-title {
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
        }

        /* Symbols Switcher */
        .symbol-tabs {
            display: flex;
            gap: 6px;
        }

        .symbol-tab {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .symbol-tab.active, .symbol-tab:hover {
            background: var(--blue-glow);
            border-color: var(--pink);
            color: #fff;
        }

        /* Order Book Table */
        .book-container {
            display: flex;
            flex-direction: column;
            flex: 1;
            padding: 8px 12px;
            font-size: 12px;
        }

        .book-table-hdr {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            padding: 6px 4px;
            color: var(--text-muted);
            font-size: 11px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border);
        }





    </style>
</head>
<body>
    
</body>
</html>
